[package]
name = "sql-hummus"
authors = ["ReactorScram"]
categories = ["command-line-utilities", "database"]
description = "Log files and key-value stores in SQLite."
documentation = "https://docs.rs/sql-hummus"
edition = "2024"
keywords = ["database", "sqlite"]
license-file = "LICENSE.md"
readme = "README.md"
repository = "https://github.com/ReactorScram/sql-hummus"
version = "0.1.1"

[dependencies]
anyhow = { version = "1.0.103", features = ["backtrace"] }
camino = "1.2.4"
chrono = "0.4.45"
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sql-peas = "0.38.1"
thiserror = "2.0.18"
ulid = { version = "3.0.0", features = ["serde"] }
